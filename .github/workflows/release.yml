name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DZAFIRO_WITH_PYTHON=ON -DZAFIRO_WITH_JAVASCRIPT=ON -DZAFIRO_WITH_LUA=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 60

      - name: Package
        run: cmake --build build --config Release --target package

      - name: Checksums (Unix)
        if: runner.os != 'Windows'
        run: cd build && sha256sum zafiro-*.zip zafiro-*.tar.gz > SHA256SUMS.txt

      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build\zafiro-*.zip, build\zafiro-*.tar.gz | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content build\SHA256SUMS.txt
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: zafiro-${{ matrix.os }}
          path: |
            build/zafiro-*.zip
            build/zafiro-*.tar.gz
            build/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: zafiro-*
          path: release
          merge-multiple: true

      - name: Generate combined checksums
        run: cd release && sha256sum zafiro-*.zip zafiro-*.tar.gz > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/zafiro-*.zip
            release/zafiro-*.tar.gz
            release/SHA256SUMS.txt
